name: Compile Check

# Refactor/fix branches + PRs: compile validation only.
# No version bump, no APK archive, no release — those stay in build.yml (main).
on:
  push:
    branches: [fix, 'refactor/**', 'feature/**']
    # 纯文档改动不触发（含本文件的修改本身）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile release
        run: ./gradlew :app:assembleRelease --no-daemon

      # 单测（Phase 1 起逐轮补齐；含网络类测试，失败会暴露而非静默）
      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      # 失败时上传完整测试报告（含断言 expected/actual 详情），方便远程排查
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testReleaseUnitTest/
          retention-days: 7
